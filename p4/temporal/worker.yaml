apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-temporal-worker
  namespace: marketplace
  labels:
    app.kubernetes.io/name: portal-temporal-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-temporal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-temporal-worker
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: marketplace/temporal-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: portal-worker-runtime
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
