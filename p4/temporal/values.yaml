# Temporal Helm chart 1.7.0 (Temporal Server 1.32.0), single Mac mini / OrbStack Kubernetes.
# External PostgreSQL is the EXISTING Compose instance; no Cassandra/Elasticsearch/SQLite.
# IMPORTANT: test host.docker.internal:5432 from inside a Pod BEFORE applying this chart.
# Copy data from the existing database first; never run postgres initdb / down -v.
server:
  replicaCount: 1
  image:
    repository: temporalio/server
    tag: "1.32.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 768Mi
  config:
    logLevel: "warn,error"
    persistence:
      defaultStore: default
      visibilityStore: visibility
      # Immutable after the first Temporal cluster bootstrap.
      numHistoryShards: 16
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            driverName: postgres12_pgx
            databaseName: temporal
            connectAddr: "host.docker.internal:5432"
            connectProtocol: tcp
            user: temporal_user
            existingSecret: temporal-db-secret
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            driverName: postgres12_pgx
            databaseName: temporal_visibility
            connectAddr: "host.docker.internal:5432"
            connectProtocol: tcp
            user: temporal_user
            existingSecret: temporal-db-secret
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
    namespaces:
      create: true
      namespace:
        - name: default
          retention: 7d
  frontend:
    replicaCount: 1
  history:
    replicaCount: 1
  matching:
    replicaCount: 1
  worker:
    replicaCount: 1

# Temporal's own internal worker above differs from our application Activity Worker.
admintools:
  enabled: false
web:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
