apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: marketplace-lab
  namespace: monitoring
  labels:
    release: monitor
spec:
  groups:
    - name: marketplace-lab
      rules:
        - alert: MarketplaceLabUnhealthy
          expr: marketplace_lab_health{namespace="marketplace-lab"} == 0
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "实验服务当前 active 实例健康指标异常"
