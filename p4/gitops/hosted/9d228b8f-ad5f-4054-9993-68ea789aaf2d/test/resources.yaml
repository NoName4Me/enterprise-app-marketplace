          image: ghcr.io/noname4me/marketplace-e2e-web@sha256:7e463b0d6995e82a28d6dde75a0f4bf07885442f2701b54e8e20c29181cde648
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
