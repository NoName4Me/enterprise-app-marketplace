apiVersion: v1
kind: Namespace
metadata:
  name: hosted-9d228b8fad5f4054999368ea789aaf2d-test
  labels:
    marketplace-app-id: 9d228b8f-ad5f-4054-9993-68ea789aaf2d
    marketplace-environment-id: 327f4636-030a-4a5c-b46b-08a7f3c0d57a
---
apiVersion: apps/v1
