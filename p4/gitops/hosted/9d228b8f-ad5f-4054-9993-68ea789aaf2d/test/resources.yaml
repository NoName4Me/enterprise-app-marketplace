metadata:
  name: web
  namespace: hosted-9d228b8fad5f4054999368ea789aaf2d-test
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
