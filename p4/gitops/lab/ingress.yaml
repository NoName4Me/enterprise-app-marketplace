apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketplace-lab
  namespace: marketplace-lab
spec:
  ingressClassName: traefik
  rules:
    - host: lab.k8s.orb.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marketplace-lab-active
                port:
                  name: http
