services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: market, POSTGRES_PASSWORD: localdev, POSTGRES_DB: market}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["market_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  market_pg:
