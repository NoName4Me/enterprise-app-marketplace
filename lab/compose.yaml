# Apply after ../compose.yaml, from the repository root. Requires Compose >=2.24.4.
services:
  postgres:
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${LAB_DATABASE_PASSWORD:?Run node lab/init-env.mjs first}
      POSTGRES_DB: market_test
    ports: !override ["127.0.0.1:55442:5432"]
    volumes: !override ["lab_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market_test"]
    mem_limit: 256m
    cpus: 1
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }
  test-service:
    image: marketplace-lab:local
    build:
      context: ./lab/test-service
      args: { SOURCE_REVISION: "${LAB_REVISION:-local}" }
    environment: { LAB_MODE: local, LAB_FAULT: "${LAB_FAULT:-healthy}" }
    ports: ["127.0.0.1:3380:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 3
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }
volumes:
  lab_pg:
