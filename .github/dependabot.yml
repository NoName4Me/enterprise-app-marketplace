version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps): 更新依赖" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "ci(deps): 更新工作流依赖" }
