# Temporary, branch-restricted bootstrap workflow. Delete after the generated
# artifacts are committed. Do not copy this pattern to ordinary PR CI.
name: T01 bootstrap generated artifacts
on:
  push:
    branches: [feat/stage1-t01-foundation]
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, 'chore(t01): record generated artifacts')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Resolve lockfile and generate migration
        env:
          DATABASE_URL: postgresql://market:testonly@localhost:5432/market_test
        run: |
          pnpm install --no-frozen-lockfile
          pnpm db:generate
      - name: Commit lockfile and migration on this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml drizzle/
          if ! git diff --cached --quiet; then
            git commit -m "chore(t01): record generated artifacts"
            git push origin HEAD:feat/stage1-t01-foundation
          fi
