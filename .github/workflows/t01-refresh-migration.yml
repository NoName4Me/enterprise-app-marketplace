# This file is temporary and is removed after regenerating the initial migration.
name: Refresh T01 initial migration
on:
  push:
    branches: [feat/stage1-t01-foundation]
permissions:
  contents: write
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, 'chore(t01): refresh generated auth migration')"
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://market:testonly@localhost:5432/market_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pnpm install --frozen-lockfile
      - name: Regenerate from clean baseline (not yet released)
        run: |
          rm -rf drizzle
          pnpm db:generate
      - name: Commit generated migration to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A drizzle/
          if ! git diff --cached --quiet; then
            git commit -m "chore(t01): refresh generated auth migration"
            git push origin HEAD:feat/stage1-t01-foundation
          fi
