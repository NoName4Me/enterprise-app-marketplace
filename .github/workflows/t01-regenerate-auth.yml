# Branch-only one-time migration regeneration; remove before merge.
name: T01 regenerate auth plugin migrations
on:
  push:
    branches: [feat/stage1-t01-foundation]
permissions: { contents: write }
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, 'chore(t01): regenerate auth migration')"
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://market:temporary@localhost:5432/tempdb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --frozen-lockfile
      - run: |
          rm -rf drizzle
          pnpm db:generate
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A drizzle/
          if ! git diff --cached --quiet; then
            git commit -m "chore(t01): regenerate auth migration"
            git push origin HEAD:feat/stage1-t01-foundation
          fi
