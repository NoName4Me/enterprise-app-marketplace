name: CI - Marketplace and container smoke
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: market, POSTGRES_PASSWORD: testonly, POSTGRES_DB: market_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market -d market_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://market:testonly@localhost:5432/market_test
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_TRUSTED_IP_HEADER: x-test-client-ip
      BETTER_AUTH_SECRET: ci-only-placeholder-keep-out-of-production-12345678
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install with locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate and apply migration
        run: |
          pnpm db:generate
          pnpm db:migrate
      - name: Bootstrap initial administrator (isolated fixture database)
        run: |
          timeout 45s node scripts/bootstrap-admin.mjs --email t01-admin@example.test --name "CI Test Admin" --ci-test-password 'CI-only-test-password-not-a-real-secret-123!'
      - name: Reject repeated admin bootstrap in non-interactive mode
        run: |
          if timeout 20s node scripts/bootstrap-admin.mjs --email t01-admin@example.test --name "CI Test Admin" --ci-test-password 'CI-only-test-password-not-a-real-secret-123!' </dev/null; then
            echo "ERROR: bootstrap allowed duplicate admin"
            exit 1
          fi
      - name: Complete fixture administrator first password change
        run: node scripts/run-demo.mjs scripts/prepare-test-admin.ts
      - name: Generate auth schema reference
        run: pnpm dlx auth@1.7.6 generate --adapter drizzle --dialect postgresql --config ./src/lib/auth.ts --output ./auth-schema.generated.ts --yes
      - name: Upload generated auth reference
        uses: actions/upload-artifact@v4
        with:
          name: better-auth-reference-schema
          path: auth-schema.generated.ts
      - name: Verify tracked schema and lock files
        run: git diff --exit-code -- pnpm-lock.yaml drizzle/
      - name: Run PostgreSQL integration tests
        run: pnpm test:db
      - name: Type, lint, unit and build
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
      - name: Install Chromium for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser end-to-end journey
        run: pnpm test:e2e
      - name: Build standalone production container
        run: docker build --tag marketplace:ci .
      - name: Smoke-test container using isolated CI PostgreSQL
        run: |
          set -euo pipefail
          docker run --detach --rm --name marketplace-smoke --network host \
            -e PORT=3100 \
            -e HOSTNAME=127.0.0.1 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BETTER_AUTH_URL=http://localhost:3100 \
            -e BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            marketplace:ci
          trap 'docker logs marketplace-smoke || true; docker rm -f marketplace-smoke || true' EXIT
          healthy=false
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health | grep -q '"status":"ok"'; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/apps)" = "401"
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: test-results/
          if-no-files-found: ignore
