name: CI - Marketplace and container smoke
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: market, POSTGRES_PASSWORD: testonly, POSTGRES_DB: market_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market -d market_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://market:testonly@localhost:5432/market_test
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_TRUSTED_IP_HEADER: x-test-client-ip
      BETTER_AUTH_SECRET: ci-only-placeholder-keep-out-of-production-12345678
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Install with locked dependencies
        run: pnpm install --frozen-lockfile
      # Fast PR checks; complete checks remain on master push.
      - name: Audit production dependencies (master)
        if: github.event_name == 'push'
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org
      - name: Generate migration reference (master)
        if: github.event_name == 'push'
        run: pnpm db:generate
      - name: Apply migration to isolated test database
        run: pnpm db:migrate
      - name: Verify P3/P5 migration metadata has no schema drift (PR)
        if: github.event_name == 'pull_request'
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle/
          test -z "$(git ls-files --others --exclude-standard drizzle/)"
      - name: Bootstrap initial administrator (isolated fixture database)
        if: github.event_name == 'push'
        run: |
          timeout 45s node scripts/bootstrap-admin.mjs --email t01-admin@example.test --name "CI Test Admin" --ci-test-password 'CI-only-test-password-not-a-real-secret-123!'
      - name: Reject repeated admin bootstrap in non-interactive mode
        if: github.event_name == 'push'
        run: |
          if timeout 20s node scripts/bootstrap-admin.mjs --email t01-admin@example.test --name "CI Test Admin" --ci-test-password 'CI-only-test-password-not-a-real-secret-123!' </dev/null; then
            echo "ERROR: bootstrap allowed duplicate admin"
            exit 1
          fi
      - name: Complete fixture administrator first password change
        if: github.event_name == 'push'
        run: node scripts/run-demo.mjs scripts/prepare-test-admin.ts
      - name: Generate auth schema reference
        if: github.event_name == 'push'
        run: pnpm dlx auth@1.7.6 generate --adapter drizzle --dialect postgresql --config ./src/lib/auth.ts --output ./auth-schema.generated.ts --yes
      - name: Upload generated auth reference
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: better-auth-reference-schema
          path: auth-schema.generated.ts
      - name: Verify tracked schema and lock files
        if: github.event_name == 'push'
        run: git diff --exit-code -- pnpm-lock.yaml drizzle/
      - name: Run PostgreSQL integration tests
        if: github.event_name == 'push'
        run: pnpm test:db
      - name: Fast required gate - typecheck lint build
        run: |
          node --test scripts/p4-open-promotion.test.mjs lab/test-service/server.test.mjs
          pnpm typecheck
          pnpm temporal:bundle
          pnpm lint
          pnpm build
      - name: Existing unit tests (master)
        if: github.event_name == 'push'
        run: pnpm test
      - name: Verify local lab service and Compose isolation
        if: github.event_name == 'push'
        run: |
          node --test lab/test-service/server.test.mjs
          node --test lab/release-policy.test.mjs lab/verify-service.test.mjs
          bash -n lab/publish.sh
          node --check lab/deploy.mjs
          node lab/init-env.mjs
          docker compose -p marketplace-lab --env-file lab/.env -f compose.yaml -f lab/compose.yaml config --quiet
          LAB_RELEASE_IMAGE=ghcr.io/noname4me/enterprise-app-marketplace-lab@sha256:$(printf '0%.0s' {1..64}) docker compose -p marketplace-lab-release -f lab/release.compose.yaml config --quiet
      - name: Install Chromium for end-to-end tests
        if: github.event_name == 'push'
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser end-to-end journey
        if: github.event_name == 'push'
        run: pnpm test:e2e
      - name: Build standalone production container
        if: github.event_name == 'push'
        run: docker build --tag marketplace:ci .
      - name: Smoke-test container using isolated CI PostgreSQL
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker run --detach --rm --name marketplace-smoke --network host \
            -e PORT=3100 \
            -e HOSTNAME=127.0.0.1 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BETTER_AUTH_URL=http://localhost:3100 \
            -e BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            marketplace:ci
          trap 'docker logs marketplace-smoke || true; docker rm -f marketplace-smoke || true' EXIT
          healthy=false
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health | grep -q '"status":"ok"'; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/apps)" = "401"
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure
          path: test-results/
          if-no-files-found: ignore
