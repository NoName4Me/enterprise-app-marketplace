# Temporary branch-only lockfile bootstrapping; delete before merge.
name: UI lockfile bootstrap
on:
  push:
    branches: [feat/t03-t04-marketplace-ui]
permissions:
  contents: write
jobs:
  lock:
    if: "!contains(github.event.head_commit.message, 'chore(ui): commit playwright lockfile')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - name: Record lockfile on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui): commit playwright lockfile"
            git push origin HEAD:feat/t03-t04-marketplace-ui
          fi
